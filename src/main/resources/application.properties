spring.application.name=PataSure

# PostgreSQL connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/patasure_db}
spring.datasource.username=${DB_USERNAME:patasure_app}
spring.datasource.password=${DB_PASSWORD}

# JPA configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Bind Spring Boot to localhost.
# Public traffic must pass through Nginx.
server.address=127.0.0.1
server.port=8080
